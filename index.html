<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5eb;--ac:#0f766e;--acbg:#d9f2ee;--wa:#b45309;--wabg:#fdeccf;--er:#b42318;--erbg:#fde3e0;--ok:#166534;--okbg:#dcf5e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2c3542;--ac:#4fd1c1;--acbg:#12332f;--wa:#f3b455;--wabg:#3a2a0e;--er:#ff8a7d;--erbg:#3d1a16;--ok:#7ee09a;--okbg:#14301e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2c3542;--ac:#4fd1c1;--acbg:#12332f;--wa:#f3b455;--wabg:#3a2a0e;--er:#ff8a7d;--erbg:#3d1a16;--ok:#7ee09a;--okbg:#14301e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.cfg{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:13px}
.cfg input{width:60px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu)}
input,select{width:100%;padding:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit}
.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;font:inherit}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.s{padding:4px 8px;font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}
td input{padding:4px 6px;width:140px}
.b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px}
.b.ok{background:var(--okbg);color:var(--ok)}.b.wa{background:var(--wabg);color:var(--wa)}.b.er{background:var(--erbg);color:var(--er)}.b.in{background:var(--acbg);color:var(--ac)}
.mu{color:var(--mu)}.al{padding:8px 0;border-bottom:1px solid var(--bd)}.al:last-child{border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a{color:var(--ac)}
:root{--ov:rgba(245,246,248,.30)}

var D=function(s){if(!s)return null;var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2])};
var fd=function(s){return s?D(s).toLocaleDateString("pt-BR"):"—"};
var MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var today=new Date();today.setHours(0,0,0,0);
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function com(i){return i.valor*S.cfg.pct/100}
function recMes(i){if(!i.pago)return null;var d=D(i.pago);return new Date(d.getFullYear(),d.getMonth()+ +S.cfg.lag,1)}
function mlabel(d){return MES[d.getMonth()]+"/"+d.getFullYear()}
function mkey(d){return d.getFullYear()*100+d.getMonth()}
function daysTo(s){return Math.round((D(s)-today)/864e5)}
function minAtual(c){
 if(!c.min)return null;
 var ci=+c.ciclo||30,d=D(c.min),n=0;
 while(d<today&&n<2000){d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+ci);n++}
 return{s:iso(d),n:n,dias:Math.round((d-today)/864e5)}}
function status(i){
 if(i.recebida)return['ok','Recebida'];
 if(i.pago)return['in','A receber'];
 if(D(i.venc)<today)return['er','Vencida'];
 return['wa','Em aberto'];}
var F={cli:"",de:"",ate:""};
function cliOf(i){var c=S.contracts.find(function(x){return x.num===i.contrato});return c?c.cliente:""}
function refKey(i){var d=recMes(i)||D(i.venc);return d.getFullYear()*100+d.getMonth()}
function mk(s){var p=s.split("-");return +p[0]*100+(+p[1]-1)}
function passF(i){
 if(F.cli&&cliOf(i)!==F.cli)return false;
 var k=refKey(i);
 if(F.de&&k<mk(F.de))return false;
 if(F.ate&&k>mk(F.ate))return false;
 return true}
function setF(k,v){F[k]=v;render()}
function clearF(){F={cli:"",de:"",ate:""};render()}
function setCfg(){S.cfg.pct=+$("pct").value||0;S.cfg.lag=+$("lag").value||0;var a=parseInt($("avi").value);S.cfg.aviso=isNaN(a)?7:a;save();render()}
function go(t){tab=t;render()}
function val(id){return $(id).value}
function conCom(c){var r=0;S.invoices.forEach(function(i){if(i.contrato===c.num&&i.recebida)r+=com(i)});var t=c.total*S.cfg.pct/100;return{t:t,r:r,f:Math.max(t-r,0)}}
function cttLink(t){if(!t)return '<span class="mu">sem contato</span>';var e=esc(t);if(t.indexOf("@")>0)return '<a href="mailto:'+e+'">'+e+'</a>';var n=t.replace(/\D/g,"");return n.length>=8?'<a href="tel:'+n+'">'+e+'</a>':e}

function addContract(){
 var c={id:Date.now(),num:val("c_num").trim(),cliente:val("c_cli").trim(),contato:val("c_ctt").trim(),total:+val("c_tot"),mensal:+val("c_men"),ini:val("c_ini"),fim:val("c_fim"),min:val("c_min"),ciclo:+val("c_ciclo")||30,encerrado:false};
 if(!c.num||!c.ini){alert("Preencha o número do contrato e o início da locação.");return}
 S.contracts.push(c);save();render()}
function addInvoice(){
 var i={id:Date.now(),contrato:val("f_con"),num:val("f_num").trim(),emissao:val("f_emi"),venc:val("f_ven"),valor:+val("f_val"),diesel:val("f_die")==="1",pago:"",recebida:false};
 if(!i.contrato||!i.num||!i.venc||!i.valor){alert("Preencha contrato, nº da fatura, vencimento e valor.");return}
 S.invoices.push(i);save();render()}
function fillVal(){var c=S.contracts.find(function(x){return x.num===val("f_con")});if(c&&c.mensal)$("f_val").value=c.mensal}
function inv(id){return S.invoices.find(function(x){return x.id===id})}
function setPago(id,chk){var i=inv(id);i.pago=chk?i.venc:"";if(!chk)i.recebida=false;save();render()}
function setRec(id,chk){inv(id).recebida=chk;save();render()}
function setDie(id,chk){inv(id).diesel=chk;save();render()}
function delInv(id){if(confirm("Excluir esta fatura?")){S.invoices=S.invoices.filter(function(x){return x.id!==id});save();render()}}
function delCon(id){var c=S.contracts.find(function(x){return x.id===id});if(c&&confirm("Excluir contrato "+c.num+" e suas faturas?")){S.contracts=S.contracts.filter(function(x){return x.id!==id});S.invoices=S.invoices.filter(function(x){return x.contrato!==c.num});save();render()}}
function toggleEnc(id){var c=S.contracts.find(function(x){return x.id===id});c.encerrado=!c.encerrado;save();render()}

function dl(name,mime,txt){var a=document.createElement("a");a.href="data:"+mime+";charset=utf-8,"+encodeURIComponent(txt);a.download=name;a.click()}
function csvOut(name,rows){var t=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(";")}).join("\n");dl(name,"text/csv","\ufeff"+t)}
var n2=function(v){return (+v||0).toFixed(2).replace(".",",")};
function csv(){
 var rows=[["Fatura","Contrato","Cliente","Emissão","Vencimento","Valor","Diesel","Pago em","Comissão","Mês de recebimento","Status"]];
 S.invoices.forEach(function(i){var m=recMes(i);rows.push([i.num,i.contrato,cliOf(i),fd(i.emissao),fd(i.venc),n2(i.valor),i.diesel?"Sim":"Não",fd(i.pago),n2(com(i)),m?mlabel(m):"",status(i)[1]])});
 csvOut("faturas.csv",rows)}
function relCsv(){
 var rows=[["Mês","Faturado","Nº faturas","Com diesel","Pago","Comissão gerada","Comissão a receber no mês"]];
 relRows().forEach(function(r){rows.push([r.l,n2(r.fat),r.nf,r.die,n2(r.pago),n2(r.cg),n2(r.rec)])});
 csvOut("relatorio-mensal.csv",rows)}
function printRel(){document.body.classList.add("pr");window.onafterprint=function(){document.body.classList.remove("pr")};try{window.print()}catch(e){alert("Impressão indisponível aqui. Use o app no PC ou o link do GitHub Pages.")}setTimeout(function(){document.body.classList.remove("pr")},1500)}

function stamp(){var d=new Date();return iso(d)}
async function backup(){
 var prev=S.lastBackup;S.lastBackup=new Date().toISOString();
 var txt=JSON.stringify(S,null,1),name="backup-comissoes-"+stamp()+".json";
 try{
  if(window.showSaveFilePicker){
   var h=await window.showSaveFilePicker({suggestedName:name,types:[{description:"Backup JSON",accept:{"application/json":[".json"]}}]});
   var w=await h.createWritable();await w.write(txt);await w.close();save();render();return}
 }catch(e){if(e&&e.name==="AbortError"){S.lastBackup=prev;return}}
 dl(name,"application/json",txt);save();render()}
function restore(ev){var f=ev.target.files[0];if(!f)return;var rd=new FileReader();
 rd.onload=function(){try{var d=JSON.parse(rd.result);
  if(!d||!Array.isArray(d.contracts)||!Array.isArray(d.invoices))throw 0;
  if(!confirm("Restaurar o backup de "+(d.lastBackup?new Date(d.lastBackup).toLocaleDateString("pt-BR"):"data desconhecida")+" com "+d.contracts.length+" contratos e "+d.invoices.length+" faturas? Os dados atuais serão substituídos.")){ev.target.value="";return}
  S=d;norm();save();render()}catch(e){alert("Arquivo inválido.")}};
 rd.readAsText(f)}
function avisoBackup(){
 if(!S.contracts.length&&!S.invoices.length)return '';
 var lb=S.lastBackup,d=lb?Math.floor((Date.now()-new Date(lb))/864e5):null;
 if(lb&&d<=7)return '';
 return '<div class="card" style="border-color:var(--wa)"><span class="b wa">Backup</span> '+(lb?'Seu último backup foi há '+d+' dias.':'Você ainda não fez backup.')+' <button class="btn s" onclick="go(\'backup\')">Fazer backup agora</button></div>'}
function backupTab(){
 var lb=S.lastBackup;
 return '<div class="card"><h2>💾 Backup dos dados</h2><p style="margin-top:0">Seus dados ficam salvos só neste navegador/computador. Se você limpar o navegador, trocar de PC ou reinstalar, <b>perde tudo</b>. Salve o arquivo de backup no OneDrive (ou Google Drive, e-mail, pen drive) para ter uma cópia segura.</p>'+
 '<div class="kpis"><div class="kpi"><small>Último backup</small><b>'+(lb?new Date(lb).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):'Nunca')+'</b></div><div class="kpi"><small>Contratos / faturas</small><b>'+S.contracts.length+' / '+S.invoices.length+'</b></div></div>'+
 '<div class="row" style="margin-top:0"><button class="btn" onclick="backup()">Salvar backup</button></div>'+
 '<p class="mu" style="font-size:12px;margin-bottom:0">Ao clicar, escolha a pasta do OneDrive para salvar (no Chrome/Edge e no programa de PC). Se o seu navegador apenas baixar o arquivo, mova-o depois para a pasta do OneDrive.</p></div>'+
 '<div class="card"><h2>Restaurar backup</h2><p class="mu" style="margin-top:0">Escolha um arquivo de backup salvo antes. Os dados atuais serão substituídos.</p><label class="btn g" style="display:inline-block;cursor:pointer;color:var(--tx);font-size:15px">Escolher arquivo de backup<input type="file" accept=".json" onchange="restore(event)" hidden></label></div>'+
 '<div class="card"><h2>Dica</h2><p style="margin:0">Faça backup toda vez que fechar o mês, ou pelo menos uma vez por semana. O app avisa no Resumo quando já faz mais de 7 dias.</p></div>'}

function filtros(){
 var cl=[];S.contracts.forEach(function(c){if(c.cliente&&cl.indexOf(c.cliente)<0)cl.push(c.cliente)});
 return '<div class="card noprint"><h2>Filtros</h2><div class="grid"><div><label>Cliente</label><select onchange="setF(\'cli\',this.value)"><option value="">Todos</option>'+cl.map(function(n){return '<option'+(F.cli===n?' selected':'')+'>'+esc(n)+'</option>'}).join("")+'</select></div><div><label>De (mês)</label><input type="month" value="'+F.de+'" onchange="setF(\'de\',this.value)"></div><div><label>Até (mês)</label><input type="month" value="'+F.ate+'" onchange="setF(\'ate\',this.value)"></div></div><div class="row"><button class="btn g s" onclick="clearF()">Limpar filtros</button></div></div>'}
function chart(){
 var by={};
 S.invoices.filter(passF).forEach(function(i){if(!i.pago)return;var m=recMes(i),k=mkey(m);by[k]=by[k]||{l:mlabel(m),r:0,a:0};if(i.recebida)by[k].r+=com(i);else by[k].a+=com(i)});
 var ks=Object.keys(by).sort();
 var h='<div class="card"><h2>Comissão por mês de recebimento</h2>';
 if(!ks.length)return h+'<span class="mu">Sem dados para o filtro escolhido.</span></div>';
 var mx=Math.max.apply(null,ks.map(function(k){return by[k].r+by[k].a}))||1,bw=76,W=Math.max(320,ks.length*bw+20),H=220,t=30,b=30,ch=H-t-b;
 var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Comissão por mês">';
 ks.forEach(function(k,n){var d=by[k],x=10+n*bw+10,w=bw-20,hr=d.r/mx*ch,ha=d.a/mx*ch,y0=t+ch;
  s+='<rect x="'+x+'" y="'+(y0-hr)+'" width="'+w+'" height="'+hr+'" rx="3" style="fill:var(--ac)"/>';
  s+='<rect x="'+x+'" y="'+(y0-hr-ha)+'" width="'+w+'" height="'+ha+'" rx="3" style="fill:var(--ac);fill-opacity:.35"/>';
  s+='<text x="'+(x+w/2)+'" y="'+(y0-hr-ha-6)+'" text-anchor="middle" font-size="11" style="fill:var(--tx)">'+(d.r+d.a).toLocaleString("pt-BR",{maximumFractionDigits:2})+'</text>';
  s+='<text x="'+(x+w/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" style="fill:var(--mu)">'+d.l+'</text>'});
 s+='</svg>';
 return h+'<div class="tw">'+s+'</div><p class="mu" style="font-size:12px;margin:6px 0 0">Barra cheia: já recebida · barra clara: a receber (valores em R$)</p></div>'}
function renovacoes(){
 var l=[];
 S.contracts.forEach(function(c){if(c.encerrado)return;var why=[],u=999,m=minAtual(c);
  if(m&&m.dias<=S.cfg.aviso){why.push(m.dias===0?'Mínimo termina hoje':'Mínimo termina em '+m.dias+' dias ('+fd(m.s)+')');u=m.dias}
  if(c.fim){var f=daysTo(c.fim);
   if(f<0){why.push('Fim da locação passou há '+(-f)+' dias ('+fd(c.fim)+') — encerrar ou atualizar?');u=Math.min(u,f)}
   else if(f<=30){why.push('Locação termina em '+f+' dias ('+fd(c.fim)+')');u=Math.min(u,f)}}
  if(why.length)l.push({c:c,why:why,u:u})});
 l.sort(function(a,b){return a.u-b.u});
 return '<div class="card"><h2>🔄 Renovações para confirmar</h2>'+(l.length?l.map(function(x){return '<div class="al"><b>'+esc(x.c.num)+'</b>'+(x.c.cliente?' — '+esc(x.c.cliente):'')+'<br><span class="b '+(x.u<0?'er':'wa')+'">'+x.why.join(' · ')+'</span> <span class="mu">Contato:</span> '+cttLink(x.c.contato)+'</div>'}).join(""):'<span class="mu">Nenhum contrato para renovar nos próximos '+S.cfg.aviso+' dias.</span>')+'</div>'}

function relRows(){
 var m={};
 function g(d){var k=mkey(d);return m[k]=m[k]||{k:k,l:mlabel(d),fat:0,nf:0,die:0,pago:0,cg:0,rec:0}}
 S.invoices.filter(function(i){return !F.cli||cliOf(i)===F.cli}).forEach(function(i){
  var e=g(D(i.emissao||i.venc));e.fat+=i.valor;e.nf++;if(i.diesel)e.die++;
  if(i.pago){var p=g(D(i.pago));p.pago+=i.valor;p.cg+=com(i);g(recMes(i)).rec+=com(i)}});
 var ks=Object.keys(m).map(Number).sort(function(a,b){return a-b});
 return ks.filter(function(k){return(!F.de||k>=mk(F.de))&&(!F.ate||k<=mk(F.ate))}).map(function(k){return m[k]})}
function relatorio(){
 var rows=relRows(),T={fat:0,nf:0,die:0,pago:0,cg:0,rec:0};
 rows.forEach(function(r){for(var k in T)T[k]+=r[k]});
 return '<div class="card rel"><h2>📊 Relatório mensal</h2><p class="mu" style="margin-top:0;font-size:13px">Gerado em '+today.toLocaleDateString("pt-BR")+(F.cli?' · Cliente: '+esc(F.cli):'')+(F.de||F.ate?' · Período: '+(F.de||'início')+' a '+(F.ate||'hoje'):'')+'<br>Faturado = faturas emitidas no mês. Pago = faturas pagas no mês. Comissão a receber = comissão dos pagamentos feitos '+S.cfg.lag+' meses antes.</p>'+
 (rows.length?'<div class="tw"><table><tr><th>Mês</th><th>Faturado</th><th>Faturas</th><th>Com diesel</th><th>Pago</th><th>Comissão gerada</th><th>Comissão a receber no mês</th></tr>'+
 rows.map(function(r){return '<tr><td>'+r.l+'</td><td>'+brl(r.fat)+'</td><td>'+r.nf+'</td><td>'+r.die+'</td><td>'+brl(r.pago)+'</td><td>'+brl(r.cg)+'</td><td><b>'+brl(r.rec)+'</b></td></tr>'}).join("")+
 '<tr style="font-weight:700"><td>Total</td><td>'+brl(T.fat)+'</td><td>'+T.nf+'</td><td>'+T.die+'</td><td>'+brl(T.pago)+'</td><td>'+brl(T.cg)+'</td><td>'+brl(T.rec)+'</td></tr></table></div>':'<span class="mu">Sem faturas para o filtro escolhido.</span>')+
 '<div class="row noprint"><button class="btn" onclick="printRel()">Imprimir / salvar PDF</button><button class="btn g" onclick="relCsv()">Exportar CSV</button></div></div>'}

function resumo(){
 var ar=0,rc=0,ab=0;
 S.invoices.filter(passF).forEach(function(i){var c=com(i);if(i.recebida)rc+=c;else if(i.pago)ar+=c;else ab+=c});
 return avisoBackup()+filtros()+'<div class="kpis"><div class="kpi"><small>A receber (clientes que já pagaram)</small><b>'+brl(ar)+'</b></div><div class="kpi"><small>Aguardando pagamento do cliente</small><b>'+brl(ab)+'</b></div><div class="kpi"><small>Já recebido</small><b>'+brl(rc)+'</b></div></div>'+
 renovacoes()+relatorio()+chart()+
 '<div class="row noprint"><button class="btn g" onclick="csv()">Exportar faturas (CSV)</button><button class="btn g" onclick="go(\'backup\')">Backup e restauração</button></div>'}

function faturas(){
 var opts=S.contracts.map(function(c){return '<option value="'+esc(c.num)+'">'+esc(c.num)+(c.cliente?' — '+esc(c.cliente):'')+'</option>'}).join("");
 var list=S.invoices.slice().sort(function(a,b){return D(b.venc)-D(a.venc)});
 return '<div class="card"><h2>Nova fatura</h2>'+(S.contracts.length?'<div class="grid"><div><label>Contrato</label><select id="f_con" onchange="fillVal()">'+opts+'</select></div><div><label>Nº da fatura</label><input id="f_num"></div><div><label>Emissão</label><input id="f_emi" type="date"></div><div><label>Vencimento (dia do pagamento)</label><input id="f_ven" type="date"></div><div><label>Valor da fatura (R$)</label><input id="f_val" type="number" step="0.01"></div><div><label>Teve diesel?</label><select id="f_die"><option value="0">Não</option><option value="1">Sim</option></select></div></div><div class="row"><button class="btn" onclick="addInvoice()">Adicionar fatura</button></div>':'<span class="mu">Cadastre um contrato primeiro.</span>')+'</div>'+
 '<div class="card tw"><table style="min-width:980px"><tr><th>Fatura</th><th>Contrato</th><th>Emissão</th><th>Vencimento</th><th>Valor</th><th>Diesel</th><th>Pago</th><th>Comissão</th><th>Recebo em</th><th>Recebida</th><th>Status</th><th></th></tr>'+
 (list.length?list.map(function(i){var s=status(i),m=recMes(i);
  return '<tr><td>'+esc(i.num)+'</td><td>'+esc(i.contrato)+'</td><td>'+fd(i.emissao)+'</td><td>'+fd(i.venc)+'</td><td>'+brl(i.valor)+'</td><td><input type="checkbox" '+(i.diesel?'checked':'')+' onchange="setDie('+i.id+',this.checked)"></td><td><label class="ck"><input type="checkbox" '+(i.pago?'checked':'')+' onchange="setPago('+i.id+',this.checked)"> '+(i.pago?fd(i.pago):'')+'</label></td><td><b>'+brl(com(i))+'</b></td><td>'+(m?mlabel(m):'—')+'</td><td>'+(i.pago?'<input type="checkbox" '+(i.recebida?'checked':'')+' onchange="setRec('+i.id+',this.checked)">':'')+'</td><td><span class="b '+s[0]+'">'+s[1]+'</span></td><td><button class="btn s g" onclick="delInv('+i.id+')">✕</button></td></tr>'}).join(""):'<tr><td colspan="12" class="mu">Nenhuma fatura cadastrada.</td></tr>')+'</table></div>'}

function contratos(){
 return '<div class="card"><h2>Novo contrato</h2><div class="grid"><div><label>Nº do contrato</label><input id="c_num"></div><div><label>Cliente (opcional)</label><input id="c_cli"></div><div><label>Valor total da locação</label><input id="c_tot" type="number" step="0.01"></div><div><label>Valor mensal</label><input id="c_men" type="number" step="0.01"></div><div><label>Início da locação</label><input id="c_ini" type="date"></div><div><label>Fim da locação (opcional)</label><input id="c_fim" type="date"></div><div><label>Fim do 1º período mínimo</label><input id="c_min" type="date"></div><div><label>Renova a cada (dias)</label><input id="c_ciclo" type="number" value="30"></div><div><label>Contato do cliente (telefone ou e-mail)</label><input id="c_ctt"></div></div><div class="row"><button class="btn" onclick="addContract()">Adicionar contrato</button></div><p class="mu" style="font-size:12px;margin-bottom:0">O período mínimo se atualiza sozinho: quando a data passa, o app soma o ciclo (30 dias) e mostra o próximo fim. Quando o cliente devolver o equipamento, clique em Encerrar.</p></div>'+
 '<div class="card tw"><table style="min-width:1100px"><tr><th>Contrato</th><th>Cliente</th><th>Total</th><th>Mensal</th><th>Início</th><th>Fim</th><th>Mínimo atual</th><th>Situação</th><th>Contato</th><th>Comissão total</th><th>Recebida</th><th>Falta</th><th></th></tr>'+
 (S.contracts.length?S.contracts.map(function(c){var k=conCom(c),m=minAtual(c),b;
  if(c.encerrado)b='<span class="b er">Encerrado</span>';
  else if(!m)b='<span class="mu">—</span>';
  else b='<span class="b '+(m.dias<=S.cfg.aviso?'wa':'ok')+'">'+(m.dias===0?'Termina hoje':'Faltam '+m.dias+' d')+'</span>';
  return '<tr><td>'+esc(c.num)+'</td><td>'+esc(c.cliente)+'</td><td>'+brl(c.total)+'</td><td>'+brl(c.mensal)+'</td><td>'+fd(c.ini)+'</td><td>'+fd(c.fim)+'</td><td>'+(m?fd(m.s)+(m.n?'<br><span class="mu" style="font-size:12px">'+m.n+' renovação(ões)</span>':''):'—')+'</td><td>'+b+'</td><td>'+cttLink(c.contato)+'</td><td>'+brl(k.t)+'</td><td>'+brl(k.r)+'</td><td><b>'+brl(k.f)+'</b></td><td><button class="btn s g" onclick="toggleEnc('+c.id+')">'+(c.encerrado?'Reativar':'Encerrar')+'</button> <button class="btn s g" onclick="delCon('+c.id+')">✕</button></td></tr>'}).join(""):'<tr><td colspan="13" class="mu">Nenhum contrato cadastrado.</td></tr>')+'</table></div>'}

function render(){
 $("pct").value=S.cfg.pct;$("lag").value=S.cfg.lag;$("avi").value=S.cfg.aviso;
 $("nav").innerHTML=[["resumo","Resumo"],["faturas","Faturas"],["contratos","Contratos"],["backup","Backup"]].map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
 $("app").innerHTML=tab==="resumo"?resumo():tab==="faturas"?faturas():tab==="backup"?backupTab():contratos();
 if(tab==="faturas"&&S.contracts.length)fillVal()}
render();
